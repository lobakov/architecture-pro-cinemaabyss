---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: movies-service-route
  namespace: cinemaabyss
spec:
  hosts:
    - events-service
  http:
    - route:
        - destination:
            host: events-service
            port:
              number: 8082
      retries:
        attempts: 3
        perTryTimeout: 2s
      timeout: 10s

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: events-service-circuit-breaker
  namespace: cinemaabyss
spec:
  host: events-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10
      http:
        http1MaxPendingRequests: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50